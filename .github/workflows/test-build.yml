name: AB Test Build

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ab-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository & project context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "AGENTS.md"
            "CLAUDE.md"
            ".ai/CORE.md"
            ".ai/MANAGER.md"
            ".ai/PROJECT_CONTEXT.md"
            ".ai/EXECUTION.md"
            ".ai/REVIEW.md"
            ".ai/UX.md"
            ".ai/REPOSITORY.md"
            ".ai/REPORTING.md"
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "::error file=$path::Required file is missing or empty"; exit 1; }
            echo "✓ $path"
          done

      - name: Check repository text quality
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl $'\r' --include='*.md' . --exclude-dir=.git | grep -q .; then
            echo "::error::CRLF line endings found in Markdown files"
            grep -RIl $'\r' --include='*.md' . --exclude-dir=.git
            exit 1
          fi
          if find . -name '*.md' -not -path './.git/*' -size 0 | grep -q .; then
            echo "::error::Empty Markdown files found"
            find . -name '*.md' -not -path './.git/*' -size 0
            exit 1
          fi
          echo "✓ Markdown quality checks passed"

  application-build:
    name: Application tests & production build
    runs-on: ubuntu-latest
    needs: repository-check
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Detect application project
        id: app
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "JavaScript application detected"
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
            echo "No application code yet — repository checks are the current build gate"
          fi

      - name: Set up Node.js
        if: steps.app.outputs.detected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.app.outputs.detected == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.detected == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.app.outputs.detected == 'true'
        run: npm test --if-present

      - name: Production build
        if: steps.app.outputs.detected == 'true'
        run: npm run build --if-present

      - name: Report current gate
        shell: bash
        run: |
          if [ "${{ steps.app.outputs.detected }}" = "true" ]; then
            echo "✓ Application test build completed"
          else
            echo "✓ Repository test build completed"
            echo "Application build steps will activate automatically when package.json is added."
          fi

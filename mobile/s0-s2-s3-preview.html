<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LoveMe S0 · S2 · S3</title>
  <link rel="stylesheet" href="./s0-s2-s3-preview.css">
</head>
<body>
  <div id="app" class="preview-frame"></div>
  <script type="module">
    import { renderNativeScreen } from "./s0-s2-s3-screens.js";
    import {
      acknowledgeLoginNotice,
      backFromAccount,
      backFromInvite,
      backFromPackDetail,
      backToSignup,
      backFromComingSoon,
      backToPackList,
      consumeOpenedLink,
      consumeSucceeded,
      createNativeFlow,
      finishSplash,
      invitePartner,
      loggedOutHome,
      noticeAcknowledged,
      openAccount,
      openComingSoonFromList,
      openMarriageFromList,
      openSendLink,
      openTasteResult,
      restoreSessionAfterSplash,
      setEmail,
      submitMagicLink
    } from "./s0-s2-s3-flow.js";
    import { createAuthApi } from "./s0-s2-s3-api.js";

    const params = new URLSearchParams(location.search);
    const start = params.get("screen") || "";
    const demo = params.get("demo") === "1" || params.get("demo") === "true" || Boolean(start);
    const loggedIn = {
      user: { id: "usr_demo", email: "sartre.art@gmail.com" },
      notice: null,
      workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false }
    };
    let state = createNativeFlow();
    if (start === "signup") state = finishSplash(state);
    if (start === "sent") state = { ...finishSplash(state), sentEmail: "buyer@example.com", email: "buyer@example.com", screen: "sent" };
    if (start === "notice") {
      state = consumeSucceeded(finishSplash(state), { ...loggedIn, notice: "no-local-draft" });
    }
    if (start === "bind") {
      state = consumeSucceeded(finishSplash(state), {
        user: { id: "usr_demo", email: "", needsEmail: true },
        notice: "no-local-draft",
        workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false }
      });
    }
    if (start === "workspace" || start === "pack-list") {
      state = noticeAcknowledged(consumeSucceeded(finishSplash(state), { ...loggedIn, notice: "no-local-draft" }), loggedIn);
    }
    if (start === "pack-detail") {
      state = openMarriageFromList(noticeAcknowledged(consumeSucceeded(finishSplash(state), { ...loggedIn, notice: "no-local-draft" }), loggedIn));
    }
    if (start === "account") {
      state = openAccount(noticeAcknowledged(consumeSucceeded(finishSplash(state), { ...loggedIn, notice: "no-local-draft" }), loggedIn));
    }
    if (start === "invite") {
      state = openSendLink(noticeAcknowledged(consumeSucceeded(finishSplash(state), { ...loggedIn, notice: "no-local-draft" }), loggedIn));
      state = { ...state, pairCodeDisplay: "4K7M", inviteUrl: "https://example.test/invite/open" };
    }
    if (start === "coming-soon" || start === "taste-result") {
      const pack = params.get("pack") || "home-mgmt";
      state = openComingSoonFromList(noticeAcknowledged(consumeSucceeded(finishSplash(state), { ...loggedIn, notice: "no-local-draft" }), loggedIn), pack);
      if (start === "taste-result") state = openTasteResult(state);
    }

    const api = createAuthApi({ origin: "" });
    const root = document.getElementById("app");

    function syncUrl() {
      const next = new URL(location.href);
      next.searchParams.set("screen", state.screen);
      history.replaceState({ screen: state.screen }, "", `${next.pathname}${next.search}`);
    }

    function paint() {
      root.innerHTML = renderNativeScreen(state);
      if (state.action === "invite-partner") {
        root.insertAdjacentHTML("beforeend", `<p class="invite-toast" role="status">S4에서 파트너를 초대해요.</p>`);
      }
      syncUrl();
    }

    root.addEventListener("submit", async (event) => {
      if (event.target.matches("[data-bind-form]")) {
        event.preventDefault();
        const email = new FormData(event.target).get("email");
        state = setEmail(state, email);
        state = { ...state, sentEmail: state.email, screen: "sent", error: "", busy: false };
        paint();
        return;
      }
      if (!event.target.matches("[data-s2-form]")) return;
      event.preventDefault();
      const email = new FormData(event.target).get("email");
      state = setEmail(state, email);
      state = demo
        ? { ...state, sentEmail: state.email, screen: "sent", error: "", busy: false }
        : await submitMagicLink(state, api);
      paint();
    });

    root.addEventListener("click", async (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;
      if (action === "back-to-signup") state = backToSignup(state);
      else if (action === "ack-notice") {
        state = demo
          ? noticeAcknowledged(state, { ...state.session, notice: null })
          : await acknowledgeLoginNotice(state, api);
      }       else if (action === "open-marriage") state = openMarriageFromList(state);
      else if (action === "open-coming-soon") {
        state = openComingSoonFromList(state, event.target.closest("[data-pack]")?.dataset.pack);
      }
      else if (action === "open-taste-result") state = openTasteResult(state);
      else if (action === "back-coming-soon" || action === "back-to-list") {
        state = action === "back-coming-soon" ? backFromComingSoon(state) : backToPackList(state);
      }
      else if (action === "open-account") state = openAccount(state);
      else if (action === "send-link") state = openSendLink(state);
      else if (action === "back-pack-detail") state = backFromPackDetail(state);
      else if (action === "back-account") state = backFromAccount(state);
      else if (action === "back-invite") state = backFromInvite(state);
      else if (action === "logout") state = loggedOutHome(state);
      else if (action === "invite-partner") state = invitePartner(state);
      else return;
      paint();
    });

    if (!start && location.search.includes("token=")) {
      consumeOpenedLink(finishSplash(state), api, location.href).then((next) => {
        state = next;
        paint();
      });
    } else if (!start) {
      paint();
      window.setTimeout(async () => {
        if (state.screen === "splash") {
          state = await restoreSessionAfterSplash(state, api);
          paint();
        }
      }, 1200);
    } else {
      paint();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoveMe S0 · S2 · S3</title>
  <link rel="stylesheet" href="./s0-s2-s3-preview.css">
</head>
<body>
  <div id="app" class="preview-frame"></div>
  <script type="module">
    import { renderNativeScreen } from "./s0-s2-s3-screens.js";
    import {
      acknowledgeLoginNotice,
      backToSignup,
      consumeOpenedLink,
      consumeSucceeded,
      createNativeFlow,
      continueFromPreviewQ1,
      finishSplash,
      invitePartner,
      openMarriageFromList,
      keepPreviewAnswer,
      noticeAcknowledged,
      openPreviewQ1,
      restoreSessionAfterSplash,
      selectPreviewChoice,
      setEmail,
      submitMagicLink
    } from "./s0-s2-s3-flow.js";
    import { createAuthApi } from "./s0-s2-s3-api.js";

    const params = new URLSearchParams(location.search);
    const start = params.get("screen") || "";
    const demo = params.get("demo") === "1" || params.get("demo") === "true" || Boolean(start);
    let state = createNativeFlow();
    if (start === "cover") state = finishSplash(state);
    if (start === "preview-q1") state = openPreviewQ1(finishSplash(state));
    if (start === "signup") state = keepPreviewAnswer(selectPreviewChoice(openPreviewQ1(finishSplash(state)), "home-rest"));
    if (start === "sent") state = { ...finishSplash(state), sentEmail: "buyer@example.com", email: "buyer@example.com", screen: "sent" };
    if (start === "notice") {
      state = consumeSucceeded(finishSplash(state), {
        user: { id: "usr_demo", email: "buyer@example.com" },
        notice: "no-local-draft",
        workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false }
      });
    }
    if (start === "bind") {
      state = consumeSucceeded(finishSplash(state), {
        user: { id: "usr_demo", email: "", needsEmail: true },
        notice: "no-local-draft",
        workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false }
      });
    }
    if (start === "workspace" || start === "pack-list") {
      state = noticeAcknowledged(consumeSucceeded(finishSplash(state), {
        user: { id: "usr_demo", email: "buyer@example.com" },
        notice: "no-local-draft",
        workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false }
      }), { user: { id: "usr_demo", email: "buyer@example.com" }, notice: null, workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false } });
    }
    if (start === "invite") {
      state = continueFromPreviewQ1(selectPreviewChoice(openPreviewQ1(noticeAcknowledged(consumeSucceeded(finishSplash(state), {
        user: { id: "usr_demo", email: "buyer@example.com" },
        notice: "no-local-draft",
        workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false }
      }), { user: { id: "usr_demo", email: "buyer@example.com" }, notice: null, workspace: { id: "ws_demo", role: "buyer", acceptedPartner: false } })), "home-rest"));
      state = { ...state, pairCodeDisplay: "4K7M 2N8P", inviteUrl: "https://example.test/invite/open" };
    }

    const api = createAuthApi({ origin: "" });
    const root = document.getElementById("app");

    function syncUrl() {
      const next = new URL(location.href);
      next.searchParams.set("screen", state.screen);
      history.replaceState({ screen: state.screen }, "", `${next.pathname}${next.search}`);
    }

    function paint() {
      root.innerHTML = renderNativeScreen(state);
      if (state.action === "invite-partner") {
        root.insertAdjacentHTML("beforeend", `<p class="invite-toast" role="status">S4에서 파트너를 초대해요.</p>`);
      }
      syncUrl();
    }

    root.addEventListener("submit", async (event) => {
      if (event.target.matches("[data-bind-form]")) {
        event.preventDefault();
        const email = new FormData(event.target).get("email");
        state = setEmail(state, email);
        state = { ...state, sentEmail: state.email, screen: "sent", error: "", busy: false };
        paint();
        return;
      }
      if (!event.target.matches("[data-s2-form]")) return;
      event.preventDefault();
      const email = new FormData(event.target).get("email");
      state = setEmail(state, email);
      state = demo
        ? { ...state, sentEmail: state.email, screen: "sent", error: "", busy: false }
        : await submitMagicLink(state, api);
      paint();
    });

    root.addEventListener("click", async (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;
      if (action === "back-to-signup") state = backToSignup(state);
      else if (action === "preview-q1") state = openPreviewQ1(state);
      else if (action === "select-q1") state = selectPreviewChoice(state, event.target.dataset.choice);
      else if (action === "keep-preview") state = keepPreviewAnswer(state);
      else if (action === "continue-preview") state = continueFromPreviewQ1(state);
      else if (action === "ack-notice") {
        state = demo
          ? noticeAcknowledged(state, { ...state.session, notice: null })
          : await acknowledgeLoginNotice(state, api);
      } else if (action === "open-marriage") state = openMarriageFromList(state);
      else if (action === "invite-partner") state = invitePartner(state);
      else return;
      paint();
    });

    if (!start && location.search.includes("token=")) {
      consumeOpenedLink(finishSplash(state), api, location.href).then((next) => {
        state = next;
        paint();
      });
    } else if (!start) {
      paint();
      window.setTimeout(async () => {
        if (state.screen === "splash") {
          state = await restoreSessionAfterSplash(state, api);
          paint();
        }
      }, 1200);
    } else {
      paint();
    }
  </script>
</body>
</html>
